# KakiCare nginx config (production, HTTP-only for now).
#
# Routes:
#   /api/      → Django (via gunicorn at http://web:8000)
#   /manage/portal/ → Django (admin site, non-guessable path)
#   /static/   → Django collected staticfiles (admin CSS, etc.)
#   everything else → the built React SPA (single-page app fallback to index.html)
#
# SECURITY:
#   - Hides nginx version (server_tokens off).
#   - Forwards X-Forwarded-For / Proto so Django can build correct URLs.
#   - Restricts the upload size to a sane default (volunteer document limit
#     is 5 MB enforced by Django; nginx ceiling is set slightly higher).

upstream django_upstream {
    # The "web" service name comes from docker-compose.prod.yml; Docker's
    # embedded DNS resolves it to the Django container.
    server web:8000;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 8m;

    # ---- Django: API endpoints ----------------------------------------------
    location /api/ {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ---- Django admin (non-guessable URL — do not advertise) ----------------
    location /manage/portal/ {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ---- Django collected static files (admin CSS, DRF browseable API, etc.) -
    # Mounted in via the static_files named volume in docker-compose.prod.yml.
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA -----------------------------------------------------------------
    # Cache hashed asset bundles aggressively; index.html stays uncached so a
    # fresh deploy reaches users immediately.
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: any unmatched path returns index.html so React Router
        # can handle client-side routing without a 404.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
