# KakiCare nginx config (production, TLS-terminated at nginx).
#
# Port 80  — ACME challenge passthrough only; everything else → 301 HTTPS.
# Port 443 — TLS 1.2 / 1.3, Let's Encrypt cert.
#
# Routes (443):
#   /api/           → Django (gunicorn at http://web:8000)
#   /manage/portal/ → Django admin (non-guessable path)
#   /static/        → Django collected staticfiles
#   everything else → built React SPA (SPA fallback to index.html)
#
# Cert location: /etc/letsencrypt/live/kakicare.duckdns.org/
#   mounted read-only from the `letsencrypt` Docker volume (docker-compose.prod.yml).
#
# First-time cert issuance (run ONCE before `docker compose up --build`):
#
#   # 1. Stop nginx so port 80 is free:
#   docker compose -f docker-compose.prod.yml stop nginx
#
#   # 2. Issue the cert (replace email):
#   docker run --rm \
#     -v kakicare_letsencrypt:/etc/letsencrypt \
#     -p 80:80 \
#     certbot/certbot certonly --standalone \
#     -d kakicare.duckdns.org \
#     --email your@email.com --agree-tos --no-eff-email
#
#   # 3. Bring up the full stack:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Cert renewal runs automatically — the certbot service checks every 12 h.
# After renewal, reload nginx: docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
#
# SECURITY:
#   - server_tokens off + more_clear_headers suppresses the Server header entirely.
#   - TLS 1.2 + 1.3 only; ECDHE/DHE ciphers; no CBC/RC4/DES/3DES.
#     Cipher list matches Mozilla Intermediate (https://ssl-config.mozilla.org/).
#   - HSTS added inside every location block — nginx's add_header inheritance
#     rule means server-level add_header is silently dropped when a location
#     block defines its own add_header directives, so HSTS must be repeated.
#   - X-Forwarded-Proto forwarded so Django sets secure-cookie + HSTS flags.

# Applied at the http context level (this file is included inside http {}).
# server_tokens off disables version disclosure; more_clear_headers removes the
# remaining "Server: nginx" token so no web-server fingerprint is exposed.
server_tokens off;
more_clear_headers 'Server';

upstream django_upstream {
    server web:8000;
}

# ── Port 80: ACME passthrough + HTTP→HTTPS redirect ──────────────────────────
server {
    listen 80;
    server_name kakicare.duckdns.org;

    # Let's Encrypt webroot HTTP-01 challenge (certbot writes here).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: permanent redirect to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: HTTPS ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name kakicare.duckdns.org;

    client_max_body_size 8m;

    # ── TLS certificate (Let's Encrypt) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/kakicare.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kakicare.duckdns.org/privkey.pem;

    # ── TLS hardening (SR-DATA-01) ────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    # ECDHE + DHE forward-secret ciphers with AES-GCM and ChaCha20.
    # No CBC mode, no RC4, no DES/3DES, no export ciphers.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Session resumption via tickets is disabled — avoids long-term key reuse.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Django: API endpoints ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # ── Django admin (non-guessable URL — do not advertise) ──────────────────
    location /manage/portal/ {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # ── Django collected static files ─────────────────────────────────────────
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # ── SPA ───────────────────────────────────────────────────────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # CSP: upgrade-insecure-requests added now that we serve HTTPS.
        # img-src includes blob: so staff can preview authenticated document
        # downloads rendered via URL.createObjectURL (same-origin, script-created
        # object URLs for content already fetched with credentials).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests; report-uri /api/csp-report/";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
