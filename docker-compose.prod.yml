# Production stack for the EC2 deployment.
#
#   nginx     :80, :443 (pub)  — TLS termination, SPA, reverse-proxy to Django
#   web       :8000 (internal) — Django + gunicorn
#   db        :5432 (internal) — PostgreSQL 16
#   certbot   (internal)       — Let's Encrypt cert issuance + 12-hourly renewal
#   scheduler (internal)       — periodic flag_missed_sessions (5-min loop)
#
# Only nginx publishes ports. Django and Postgres are reachable only inside
# the Docker network.
#
# First-time HTTPS setup — do this once on the EC2:
#
#   # Issue the cert (nginx must be up on :80 to serve the ACME challenge):
#   docker compose -f docker-compose.prod.yml up -d nginx certbot
#   docker compose -f docker-compose.prod.yml run --rm certbot \
#     certonly --webroot -w /var/www/certbot \
#     -d kakicare.duckdns.org \
#     --email your@email.com --agree-tos --no-eff-email
#   # Then bring the full stack up:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Bring the full stack up normally with:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16
    container_name: kakicare-db-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - kakicare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
    container_name: kakicare-web-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - private_media:/app/private_media

  # Runs flag_missed_sessions on a 5-minute loop so 'confirmed' sessions that
  # were never checked into transition to 'missed' once the grace period passes.
  # 'missed' is the only status from which staff can record a follow-up, so
  # without this the welfare follow-up flow never fires in production.
  #
  # Reuses the backend image but overrides the entrypoint: migrate/collectstatic
  # are owned by `web`, so we skip them here and just drop to the non-root `app`
  # user (via gosu) and loop. The loop tolerates transient DB errors (e.g. before
  # web has finished migrating) — it logs and retries on the next tick. Mirrors
  # the certbot loop pattern so TERM shuts it down cleanly.
  scheduler:
    build:
      context: ./backend
    container_name: kakicare-scheduler-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    entrypoint:
      - gosu
      - app
      - /bin/sh
      - -c
      - 'trap exit TERM; while :; do python manage.py flag_missed_sessions || true; sleep 300 & wait $$!; done'

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: kakicare-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_files:/usr/share/nginx/static:ro
      # Let's Encrypt certs — written by certbot, read by nginx.
      - letsencrypt:/etc/letsencrypt:ro
      # Certbot webroot — certbot writes challenge files; nginx serves them on :80.
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot:latest
    container_name: kakicare-certbot
    restart: unless-stopped
    volumes:
      # Write access: certbot stores and renews certs here.
      - letsencrypt:/etc/letsencrypt
      # Write access: certbot places HTTP-01 challenge files here.
      - certbot_www:/var/www/certbot
    # Renew every 12 h (certs expire after 90 days; renew starts at 30 days left).
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $$!; done'

volumes:
  kakicare_pgdata:
  static_files:
  private_media:
  # Let's Encrypt cert store — contains private keys; never bind-mount into the repo.
  letsencrypt:
  # Certbot webroot — only holds short-lived ACME challenge tokens.
  certbot_www:
