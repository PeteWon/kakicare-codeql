# Dependabot keeps our dependencies patched and is part of our D2 dependency-check
# evidence. It opens PRs when a newer (or security-fixed) version is available, on
# a weekly cadence, for every ecosystem we use. PRs run through the normal CI
# pipeline (frontend/backend jobs), so an update can't merge unless it stays green.
version: 2
updates:
  # --- Python (Django backend) ---------------------------------------------
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]

  # --- npm (React frontend) ------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]

  # --- GitHub Actions used in our workflows --------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]

  # --- Docker base images --------------------------------------------------
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
  - package-ecosystem: docker
    directory: /nginx
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
