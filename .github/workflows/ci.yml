# Continuous integration — runs on every PR and every push.
# Two jobs in parallel; both must pass before deploy.yml will run on main.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel in-progress runs on the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Production build
        run: npm run build

  backend:
    name: Backend check + tests
    runs-on: ubuntu-latest
    # Postgres service container — matches the version in docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kakicare
          POSTGRES_USER: kakicare
          POSTGRES_PASSWORD: ci-only-not-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kakicare -d kakicare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-secret-key-do-not-reuse
      DEBUG: 'True'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      POSTGRES_DB: kakicare
      POSTGRES_USER: kakicare
      POSTGRES_PASSWORD: ci-only-not-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations apply cleanly
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity 2
